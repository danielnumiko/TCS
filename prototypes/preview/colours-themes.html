<!-- @dsCard group="Colors" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="_card.css" />
</head>
<body>
<div class="card">
  <div class="eyebrow">Theme modes — one variable, five flavours</div>
  <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px;">
    <div data-theme="light" style="background: var(--primary-bg); color: var(--type-heading); padding: 14px 12px; border: 1px solid #DCDCDC;">
      <div style="font-weight: 700; font-size: 15px;">Light</div>
      <div style="height: 22px; background: var(--brand-accent); margin-top: 10px;"></div>
      <div style="font-size: 11px; margin-top: 6px; font-family: ui-monospace, monospace; color: var(--type-muted);">Broom</div>
    </div>
    <div data-theme="dark" style="background: var(--primary-bg); color: var(--type-heading); padding: 14px 12px;">
      <div style="font-weight: 700; font-size: 15px;">Dark</div>
      <div style="height: 22px; background: var(--brand-accent); margin-top: 10px;"></div>
      <div style="font-size: 11px; margin-top: 6px; font-family: ui-monospace, monospace; color: var(--type-muted);">Broom</div>
    </div>
    <div data-theme="yellow" style="background: var(--primary-bg); color: var(--type-heading); padding: 14px 12px;">
      <div style="font-weight: 700; font-size: 15px;">Yellow</div>
      <div style="height: 22px; background: var(--black-950); margin-top: 10px;"></div>
      <div style="font-size: 11px; margin-top: 6px; font-family: ui-monospace, monospace; color: var(--type-muted);">Appeals</div>
    </div>
    <div data-theme="resources-light" style="background: var(--primary-bg); color: var(--type-heading); padding: 14px 12px; border: 1px solid #DCDCDC;">
      <div style="font-weight: 700; font-size: 15px;">Res. Light</div>
      <div style="height: 22px; background: var(--brand-accent); margin-top: 10px;"></div>
      <div style="font-size: 11px; margin-top: 6px; font-family: ui-monospace, monospace; color: var(--type-muted);">Teal</div>
    </div>
    <div data-theme="resources-dark" style="background: var(--primary-bg); color: var(--type-heading); padding: 14px 12px;">
      <div style="font-weight: 700; font-size: 15px;">Res. Dark</div>
      <div style="height: 22px; background: var(--white-50); margin-top: 10px;"></div>
      <div style="font-size: 11px; margin-top: 6px; font-family: ui-monospace, monospace; color: var(--type-muted);">Teal flood</div>
    </div>
  </div>
  <div style="margin-top: 14px; font-size: 12px; color: #5D5D5D; line-height: 1.5;">
    Set <code style="font-family: ui-monospace, monospace;">data-theme</code> on <code style="font-family: ui-monospace, monospace;">&lt;html&gt;</code> to switch the entire page. Children inherit unless they override.
  </div>
</div>
</body>
</html>
