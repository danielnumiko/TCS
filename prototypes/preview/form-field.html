<!-- @dsCard group="Components" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="_card.css" />
<style>
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field .lbl { font-size: 15px; font-weight: 500; color: #000; }
  .field .inp {
    background: #fff; border: 2px solid #000; padding: 14px 16px;
    font-family: var(--font-brand); font-size: 16px; color: #000; min-height: 28px;
  }
  .field .inp.placeholder { color: #6D6D6D; }
  .field .inp.disabled { background: #EFEFEF; border-color: #BDBDBD; color: #BDBDBD; }
  .field .hint { font-size: 13px; color: #5D5D5D; }
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">Text field · 2px black border · square</div>
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 22px; margin-top: 18px;">
    <div class="field">
      <div class="lbl">First name</div>
      <div class="inp">Helya</div>
    </div>
    <div class="field">
      <div class="lbl">Email address</div>
      <div class="inp placeholder">you@example.com</div>
    </div>
    <div class="field">
      <div class="lbl">Postcode</div>
      <div class="inp disabled">SE1 2AA</div>
      <div class="hint">Disabled until country selected</div>
    </div>
    <div class="field">
      <div class="lbl">Subject</div>
      <div class="inp" style="display: flex; align-items: center; justify-content: space-between;">Donating <span style="font-size: 14px;">▾</span></div>
    </div>
  </div>
</div>
</body>
</html>
