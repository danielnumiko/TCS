<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="_card.css" />
</head>
<body>
<div class="card">
  <div class="eyebrow">Body, CTA, label, tag · BentonSans</div>
  <p style="margin: 0; font-size: 20px; line-height: 1.45; max-width: 540px;">There is no one-size-fits-all approach. To help young people open up, we might start with chess, a fidget spinner or writing.</p>
  <div style="display: flex; gap: 28px; margin-top: 20px; align-items: baseline;">
    <span style="font-size: 18px; font-weight: 500;">Donate today</span>
    <span style="font-size: 16px; font-weight: 500;">Read more</span>
    <span style="font-size: 15px; font-weight: 500; letter-spacing: 0.01em;">Label / byline</span>
    <span style="display: inline-block; font-size: 14px; font-weight: 500; padding: 4px 10px; border: 1.5px solid #000; letter-spacing: 0.02em;">Category tag</span>
  </div>
  <div style="margin-top: 18px; display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px; font-size: 11px; color: #6D6D6D; font-family: ui-monospace, monospace;">
    <span>Body · 20px / 1.45</span>
    <span>CTA · 18px / 500</span>
    <span>Label · 15px / 500</span>
    <span>Tag · 14px / 500</span>
  </div>
</div>
</body>
</html>
