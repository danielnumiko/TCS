<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />

<body>
<div class="card" style="background: #000; color: #fff;">
  <div class="eyebrow" style="color: #BDBDBD;">Handwritten · TCS Beta · emotional pull-quotes only</div>
  <div class="tcs-quote" style="font-size: 56px; line-height: 1.05; color: #fff; margin-top: 18px;">"It helped me become more confident."</div>
  <div style="display: flex; align-items: center; gap: 24px; margin-top: 20px;">
    <span class="tcs-quote" style="font-size: 28px; color: #fff;">I feel like I belong</span>
    <span style="font-size: 11px; color: #BDBDBD; font-family: ui-monospace, monospace;">/ footer signature, 28px</span>
  </div>
  <div style="margin-top: 18px; font-size: 12px; color: #BDBDBD; line-height: 1.5; max-width: 520px;">
    Use sparingly: hero pull-quote, story callout, footer signature. Never for body, UI labels, or buttons. Fallback: Caveat → Patrick Hand.
  </div>
</div>
</body>
</html>
