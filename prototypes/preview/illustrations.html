<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="_card.css" />
<style>
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; margin-top: 4px; }
  .slot { aspect-ratio: 1/1; background-size: contain; background-repeat: no-repeat; background-position: center; }
  .lab { font-size: 10px; color: #5D5D5D; text-align: center; margin-top: 4px; font-family: var(--font-brand); font-weight: 500; }
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">Brushy illustration set · six core variants</div>
  <div class="grid">
    <div><div class="slot" style="background-image: url('../assets/illustrations/campaign.png');"></div><div class="lab">Campaign</div></div>
    <div><div class="slot" style="background-image: url('../assets/illustrations/donate.png');"></div><div class="lab">Donate</div></div>
    <div><div class="slot" style="background-image: url('../assets/illustrations/volunteer.png');"></div><div class="lab">Volunteer</div></div>
    <div><div class="slot" style="background-image: url('../assets/illustrations/fundraising.png');"></div><div class="lab">Fundraising</div></div>
    <div><div class="slot" style="background-image: url('../assets/illustrations/heart.png');"></div><div class="lab">Heart</div></div>
    <div><div class="slot" style="background-image: url('../assets/illustrations/rainbow.png');"></div><div class="lab">Rainbow</div></div>
  </div>
  <div style="font-size: 12px; color: #5D5D5D; line-height: 1.55; margin-top: 16px;">
    Hand-painted in yellow, orange and lightening yellow with a wobbly black brush outline. Lives in cards at 80–180 px. Original SVGs in <code style="font-family: ui-monospace, monospace;">assets/illustrations/</code>; PNGs alongside for fast loads.
  </div>
</div>
</body>
</html>
