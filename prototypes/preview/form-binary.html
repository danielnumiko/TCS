<!-- @dsCard group="Components" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="_card.css" />
<style>
  .row { display: flex; gap: 28px; align-items: center; margin-bottom: 14px; }
  .box, .radio { width: 24px; height: 24px; border: 2px solid #000; background: #fff; display: inline-flex; align-items: center; justify-content: center; }
  .radio { border-radius: 50%; }
  .box.checked { background: #FFEB00; }
  .box.checked::after { content: ""; width: 12px; height: 7px; border-left: 3px solid #000; border-bottom: 3px solid #000; transform: rotate(-45deg); margin-top: -3px; }
  .radio.checked::after { content: ""; width: 12px; height: 12px; background: #000; border-radius: 50%; }
  .label { font-size: 16px; color: #000; }
  .group { display: flex; align-items: center; gap: 10px; }
  .group.disabled { opacity: 0.45; }
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">Binary inputs · checkbox + radio</div>
  <div class="row" style="margin-top: 14px;">
    <div class="group"><div class="box"></div><span class="label">Default</span></div>
    <div class="group"><div class="box checked"></div><span class="label">Checked</span></div>
    <div class="group disabled"><div class="box"></div><span class="label">Disabled</span></div>
  </div>
  <div class="row">
    <div class="group"><div class="radio"></div><span class="label">£5</span></div>
    <div class="group"><div class="radio checked"></div><span class="label">£25</span></div>
    <div class="group"><div class="radio"></div><span class="label">£50</span></div>
    <div class="group"><div class="radio"></div><span class="label">Other</span></div>
  </div>
  <div style="font-size: 12px; color: #5D5D5D; line-height: 1.5; margin-top: 4px;">Checked = brand-accent fill (Broom yellow) · checkmark stroke remains black.</div>
</div>
</body>
</html>
