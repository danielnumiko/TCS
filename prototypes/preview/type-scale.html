<!-- @dsCard group="Type" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="_card.css" />
<style>
  .scale-row { display: grid; grid-template-columns: 56px 1fr; gap: 16px; align-items: baseline; padding: 4px 0; }
  .scale-row .token { font-family: ui-monospace, monospace; font-size: 11px; color: #6D6D6D; }
  .scale-row .specimen { font-family: var(--font-brand); font-weight: 700; letter-spacing: -0.01em; line-height: 1; color: #000; }
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">Font scale · 13 → 120 px</div>
  <div class="scale-row"><span class="token">120</span><span class="specimen" style="font-size: 80px;">Aa</span></div>
  <div class="scale-row"><span class="token">80</span><span class="specimen" style="font-size: 56px;">Aa</span></div>
  <div class="scale-row"><span class="token">60</span><span class="specimen" style="font-size: 44px;">Aa</span></div>
  <div class="scale-row"><span class="token">48</span><span class="specimen" style="font-size: 36px;">Aa</span></div>
  <div class="scale-row"><span class="token">32</span><span class="specimen" style="font-size: 26px;">Aa</span></div>
  <div class="scale-row"><span class="token">20</span><span class="specimen" style="font-size: 20px;">Aa</span></div>
  <div class="scale-row"><span class="token">16</span><span class="specimen" style="font-size: 16px;">Aa</span></div>
  <div class="scale-row"><span class="token">14</span><span class="specimen" style="font-size: 14px;">Aa</span></div>
  <div style="font-size: 11px; color: #6D6D6D; margin-top: 8px; font-family: ui-monospace, monospace;">Full scale: 13 14 15 16 18 20 26 30 32 36 40 42 48 60 64 80 100 120 px</div>
</div>
</body>
</html>
