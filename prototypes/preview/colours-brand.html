<!-- @dsCard group="Colors" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="_card.css" />
</head>
<body>
<div class="card">
  <div class="eyebrow">Brand colours</div>
  <div class="card-row" style="gap: 20px;">
    <div class="swatch" style="flex: 2;">
      <div class="chip" style="background: #FFEB00; aspect-ratio: 2 / 1; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.04);"></div>
      <div class="name">Broom 500 (brand)</div>
      <div class="hex">#FFEB00 · primary brand</div>
    </div>
    <div class="swatch" style="flex: 1;">
      <div class="chip" style="background: #029E9C; aspect-ratio: 1 / 1;"></div>
      <div class="name">Breaker bay 600</div>
      <div class="hex">#029E9C · Resources brand</div>
    </div>
    <div class="swatch" style="flex: 1;">
      <div class="chip" style="background: #000000; aspect-ratio: 1 / 1;"></div>
      <div class="name">Black 950</div>
      <div class="hex">#000000 · ink + UI</div>
    </div>
    <div class="swatch" style="flex: 1;">
      <div class="chip" style="background: #FFFFFF; aspect-ratio: 1 / 1; box-shadow: inset 0 0 0 1px #DCDCDC;"></div>
      <div class="name">White 50</div>
      <div class="hex">#FFFFFF · surface</div>
    </div>
  </div>
  <div style="margin-top: 16px; font-size: 12px; color: #5D6D6D; line-height: 1.5;">
    Brand pivots through <code style="font-family: ui-monospace, monospace;">--brand-accent</code> — Broom in Light/Dark/Yellow, Breaker bay in Resources. Never bind components to a primitive directly.
  </div>
</div>
</body>
</html>
