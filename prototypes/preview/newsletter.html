<!-- @dsCard group="Components" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="_card.css" />
</head>
<body data-theme="yellow">
<div class="card" style="background: #FFEB00; padding: 32px;">
  <div class="card-row" style="gap: 36px; align-items: flex-start;">
    <div style="flex: 1;">
      <h2 style="font-size: 36px; font-weight: 700; margin: 0 0 12px; line-height: 1.05; color: #000;">Keep in touch</h2>
      <p style="font-size: 14px; line-height: 1.5; margin: 0; color: #000;">Sign up to receive email updates about our work and how you can support vulnerable children.</p>
    </div>
    <div style="flex: 1.2; display: flex; flex-direction: column; gap: 10px;">
      <input style="border: 2px solid #000; padding: 10px 12px; background: transparent; font-family: var(--font-brand); font-size: 14px; color: #000;" placeholder="First name" />
      <input style="border: 2px solid #000; padding: 10px 12px; background: transparent; font-family: var(--font-brand); font-size: 14px; color: #000;" placeholder="Email address" />
      <button style="border: 2px solid #000; background: #000; color: #fff; padding: 12px 16px; font-family: var(--font-brand); font-weight: 700; font-size: 14px; cursor: pointer;">Subscribe →</button>
    </div>
  </div>
</div>
</body>
</html>
