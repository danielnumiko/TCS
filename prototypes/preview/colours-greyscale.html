<!-- @dsCard group="Colors" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="_card.css" />
</head>
<body>
<div class="card">
  <div class="eyebrow">Greyscale · ink and neutral surfaces</div>
  <div class="card-row wrap" style="gap: 8px;">
    <div class="swatch" style="flex: 1; min-width: 56px;"><div class="chip" style="background: #000000;"></div><div class="name">Black 950</div><div class="hex">#000000</div></div>
    <div class="swatch" style="flex: 1; min-width: 56px;"><div class="chip" style="background: #3D3D3D;"></div><div class="name">Black 900</div><div class="hex">#3D3D3D</div></div>
    <div class="swatch" style="flex: 1; min-width: 56px;"><div class="chip" style="background: #454545;"></div><div class="name">Black 800</div><div class="hex">#454545</div></div>
    <div class="swatch" style="flex: 1; min-width: 56px;"><div class="chip" style="background: #4F4F4F;"></div><div class="name">Black 700</div><div class="hex">#4F4F4F</div></div>
    <div class="swatch" style="flex: 1; min-width: 56px;"><div class="chip" style="background: #5D5D5D;"></div><div class="name">Black 600</div><div class="hex">#5D5D5D</div></div>
    <div class="swatch" style="flex: 1; min-width: 56px;"><div class="chip" style="background: #6D6D6D;"></div><div class="name">Black 500</div><div class="hex">#6D6D6D</div></div>
  </div>
  <div class="card-row wrap" style="gap: 8px; margin-top: 14px;">
    <div class="swatch" style="flex: 1; min-width: 56px;"><div class="chip" style="background: #7C7C7C;"></div><div class="name">White 500</div><div class="hex">#7C7C7C</div></div>
    <div class="swatch" style="flex: 1; min-width: 56px;"><div class="chip" style="background: #989898;"></div><div class="name">White 400</div><div class="hex">#989898</div></div>
    <div class="swatch" style="flex: 1; min-width: 56px;"><div class="chip" style="background: #BDBDBD;"></div><div class="name">White 300</div><div class="hex">#BDBDBD</div></div>
    <div class="swatch" style="flex: 1; min-width: 56px;"><div class="chip" style="background: #DCDCDC;"></div><div class="name">White 200</div><div class="hex">#DCDCDC</div></div>
    <div class="swatch" style="flex: 1; min-width: 56px;"><div class="chip" style="background: #EFEFEF;"></div><div class="name">White 100</div><div class="hex">#EFEFEF</div></div>
    <div class="swatch" style="flex: 1; min-width: 56px;"><div class="chip" style="background: #FFFFFF; box-shadow: inset 0 0 0 1px #DCDCDC;"></div><div class="name">White 50</div><div class="hex">#FFFFFF</div></div>
  </div>
</div>
</body>
</html>
