<!-- @dsCard group="Spacing" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="_card.css" />
<style>
  .row { display: grid; grid-template-columns: 60px 1fr 50px; align-items: center; padding: 4px 0; font-family: var(--font-brand); }
  .row .label { font-size: 11px; color: #6D6D6D; font-family: ui-monospace, monospace; }
  .row .bar { height: 12px; background: #FFEB00; border-right: 2px solid #000; }
  .row .px { font-size: 11px; color: #000; font-family: ui-monospace, monospace; text-align: right; }
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">Spacing scale @ 1280 · fluid · flips per breakpoint</div>
  <div class="row"><span class="label">xxs</span><span class="bar" style="width: 4px;"></span><span class="px">4</span></div>
  <div class="row"><span class="label">xs</span><span class="bar" style="width: 8px;"></span><span class="px">8</span></div>
  <div class="row"><span class="label">sm</span><span class="bar" style="width: 12px;"></span><span class="px">12</span></div>
  <div class="row"><span class="label">m</span><span class="bar" style="width: 16px;"></span><span class="px">16</span></div>
  <div class="row"><span class="label">lg</span><span class="bar" style="width: 20px;"></span><span class="px">20</span></div>
  <div class="row"><span class="label">xl</span><span class="bar" style="width: 28px;"></span><span class="px">28</span></div>
  <div class="row"><span class="label">2xl</span><span class="bar" style="width: 40px;"></span><span class="px">40</span></div>
  <div class="row"><span class="label">3xl</span><span class="bar" style="width: 60px;"></span><span class="px">60</span></div>
  <div class="row"><span class="label">4xl</span><span class="bar" style="width: 80px;"></span><span class="px">80</span></div>
  <div class="row"><span class="label">5xl</span><span class="bar" style="width: 100px;"></span><span class="px">100</span></div>
  <div class="row"><span class="label">6xl</span><span class="bar" style="width: 140px;"></span><span class="px">140</span></div>
  <div class="row"><span class="label">7xl</span><span class="bar" style="width: 200px;"></span><span class="px">200</span></div>
</div>
</body>
</html>
