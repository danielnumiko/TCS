<!-- @dsCard group="Spacing" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="_card.css" />
</head>
<body>
<div class="card">
  <div class="eyebrow">Section rhythm · between major slices</div>
  <div style="position: relative; padding: 6px 0;">
    <div style="height: 60px; background: #EFEFEF; display: flex; align-items: center; padding-left: 14px; font-weight: 700; font-size: 14px;">Section A · Hero</div>
    <div style="height: 120px; display: flex; align-items: center; justify-content: center; position: relative;">
      <span style="font-family: ui-monospace, monospace; font-size: 11px; color: #6D6D6D;">120 px · Between slices (sitewide @ 1280)</span>
      <span style="position: absolute; left: 60px; right: 60px; top: 50%; height: 1px; background: repeating-linear-gradient(to right, #BDBDBD 0, #BDBDBD 4px, transparent 4px, transparent 8px); z-index: -1;"></span>
    </div>
    <div style="height: 60px; background: #EFEFEF; display: flex; align-items: center; padding-left: 14px; font-weight: 700; font-size: 14px;">Section B · Stories</div>
  </div>
  <div style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px; margin-top: 18px; font-size: 11px; color: #6D6D6D; font-family: ui-monospace, monospace;">
    <span>@ 320 · 60 px</span>
    <span>@ 768 · 80 px</span>
    <span>@ 1280 · 120 px</span>
    <span>@ 1600 · 140 px</span>
  </div>
</div>
</body>
</html>
